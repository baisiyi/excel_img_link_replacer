name: Build and Release Desktop App

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.24.7"
  APP_ID: "com.bestfulfill.excelimgreplacer"
  PROJECT_NAME: "Excel图片链接替换工具"
  ICON_PATH: "icon.png"
  CMD_PATH: "./cmd/desktop"

jobs:
  quality:
    name: Test and Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...

  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install the Fyne CLI tool
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Build and package Windows app
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          APP_ID: ${{ env.APP_ID }}
          ICON_PATH: ${{ env.ICON_PATH }}
          CMD_PATH: ${{ env.CMD_PATH }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $BUILD_NAME = "ExcelImageReplacer"
          if (!(Test-Path $env:ICON_PATH)) {
            Write-Error "Icon file not found: $env:ICON_PATH"
            exit 1
          }
          $ICON_ABS_PATH = (Resolve-Path $env:ICON_PATH).Path

          fyne package --app-id $env:APP_ID --icon $ICON_ABS_PATH --name $BUILD_NAME -src $env:CMD_PATH --release

          $exeBuilt = "$BUILD_NAME.exe"
          $targetExe = "$env:PROJECT_NAME.exe"
          $outputZip = "$env:PROJECT_NAME-windows-amd64-unsigned.zip"

          if (Test-Path $exeBuilt) {
            Rename-Item -Path $exeBuilt -NewName $targetExe -Force
          } else {
            $srcExe = Join-Path $env:CMD_PATH "$BUILD_NAME.exe"
            if (!(Test-Path $srcExe)) {
              Write-Error "Build failed: Expected output file '$exeBuilt' not found."
              exit 1
            }
            Move-Item -Path $srcExe -Destination ".\$targetExe" -Force
          }

          Compress-Archive -Path $targetExe -DestinationPath $outputZip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-package
          path: ./${{ env.PROJECT_NAME }}-windows-amd64-unsigned.zip

  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-14
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install the Fyne CLI tool
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Build and package macOS app
        run: |
          if [ ! -f "${{ env.ICON_PATH }}" ]; then echo "Icon file not found"; exit 1; fi
          export MACOSX_DEPLOYMENT_TARGET=10.14
          ICON_ABS_PATH="$(pwd)/${{ env.ICON_PATH }}"
          fyne package --app-id ${{ env.APP_ID }} --icon "$ICON_ABS_PATH" --name ${{ env.PROJECT_NAME }} -src ${{ env.CMD_PATH }}
          if [ -d "${{ env.PROJECT_NAME }}.app" ]; then
            zip -r "${{ env.PROJECT_NAME }}-macos-arm64.zip" "${{ env.PROJECT_NAME }}.app"
          elif [ -f "${{ env.PROJECT_NAME }}.zip" ]; then
            mv ./${{ env.PROJECT_NAME }}.zip ./${{ env.PROJECT_NAME }}-macos-arm64.zip
          else
            echo "Error: No output file found. Listing current directory:"
            ls -la
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-package
          path: ./${{ env.PROJECT_NAME }}-macos-arm64.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [quality, build-windows, build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Display structure of downloaded files
        run: ls -R artifacts
      - name: Create unsigned Windows release note
        run: |
          cat > release-notes.md <<'EOF'
          ## 分发说明

          - Windows 包为未签名内部测试包：`Excel图片链接替换工具-windows-amd64-unsigned.zip`
          - 首次下载或运行时，浏览器、Windows Defender SmartScreen 或安全软件可能出现安全提示。
          - 如出现 SmartScreen，请点击“更多信息”后选择“仍要运行”。
          - 该 Windows 包仅建议通过企业内部可信渠道小范围分发。
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          generate_release_notes: true
